name: ECWE Backend CI/CD
#Build triggers
on:
  push:
    branches:
      - develop
      - uat


  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - develop
      - uat


  workflow_dispatch:
    #Build parameters
    inputs:
      build_only:
        description: Builds and Deploys application
        required: true
        type: boolean
        default: true

      build_image_tag:
        description: Build Image Tag (Optional)
        required: false
        type: string
        default: v0.0.0

      deploy_only:
        description: Deploys application
        required: true
        type: boolean
        default: true

      deploy_image_tag:
        description: Deployment Image Tag (Optional)
        required: false
        type: string
        default: v0.0.0

      deploy_environment:
        description: Backend Web App environment
        required: true
        type: choice
        options:
          - dev
          - uat
        default: dev

jobs:
  set_build_params:
    name: Set up build and deploy parameters
    runs-on: ubuntu-latest
    outputs:
      BUILD_IMAGE_TAG: ${{ steps.set_build_image.outputs.BUILD_IMAGE_TAG }}
      DEPLOY_IMAGE_TAG: ${{ steps.set_deploy_image.outputs.DEPLOY_IMAGE_TAG }}
      DEPLOY_ENV: ${{ steps.set_env.outputs.DEPLOY_ENV }}
    steps:
      - name: Set Build Image 
        id: set_build_image
        run: |
          #Get the branch name
          if [ "${{ github.event_name }}" == "push" ]; then
            BRANCH_NAME=${GITHUB_REF##*/}
          elif [ "${{ github.event_name }}" == "pull_request" ]; then
            BRANCH_NAME=${{ github.base_ref }}
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            BRANCH_NAME=${GITHUB_REF##*/}
          fi
          if [ "$BRANCH_NAME" == "develop" ]; then 
            BRANCH_NAME="dev"
          fi
          #Set the Build Image tag
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.build_image_tag }}" != "v0.0.0" ]; then
            IMAGE_TAG=${{ github.event.inputs.build_image_tag }}
          else
            #Uncomment the below line if you want to use image tag like - branch-gitCommitHash. eg: IMAGE_TAG->'dev-abcd123'
            #IMAGE_TAG=$BRANCH_NAME-${GITHUB_SHA::7}
            #Uncomment the below line if you want to use image tag like - branch-timestamp(mmHHDDMMYY) 
            #IMAGE_TAG=$BRANCH_NAME-$(date +'%m%H%d%m%y')
            #Uncomment the below line if you want to use image tag like - branch-gitHubActionBuildNumber
            IMAGE_TAG=$BRANCH_NAME-${{ github.run_number }}
          fi 
          echo "BUILD_IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "BRANCH_NAME=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Set Deploy Image 
        id: set_deploy_image
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ ${{ github.event.inputs.build_only }} != true ] && [ "${{ github.event.inputs.deploy_image_tag }}" == "v0.0.0" ]; then
            echo "Error! No image tag provided for Deploy only Workflow"
            exit 1
          fi
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.deploy_image_tag }}" != "v0.0.0" ]; then
            echo "DEPLOY_IMAGE_TAG=${{ github.event.inputs.deploy_image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "DEPLOY_IMAGE_TAG=${{ steps.set_build_image.outputs.BUILD_IMAGE_TAG }}" >> "$GITHUB_OUTPUT"
          fi
      
      - name: Set Deploy Environment
        id: set_env
        run: |
          
          if [ "${{ github.event_name }}" == "push" ] || [ "${{ github.event_name }}" == "pull_request" ]; then
            case ${{ steps.set_build_image.outputs.BRANCH_NAME }} in
              "dev")
                DEPLOY_ENV="backend-dev"
                ;;
              "uat")
                DEPLOY_ENV="backend-uat"
                ;;
            esac
          else
            DEPLOY_ENV="backend-${{ github.event.inputs.deploy_environment }}"
          fi
          echo "DEPLOY_ENV=$DEPLOY_ENV" >> "$GITHUB_OUTPUT"

  build_and_deploy:
    name: check build and deploy parameters
    runs-on: ubuntu-latest
    needs: set_build_params
    environment: ${{ needs.set_build_params.outputs.DEPLOY_ENV }}
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: true
          
      - name: check bd params
        run: |
          echo "My Build image : ${{ needs.set_build_params.outputs.BUILD_IMAGE_TAG }}"
          echo "My deploy image : ${{ needs.set_build_params.outputs.DEPLOY_IMAGE_TAG }}"
          echo "My env : ${{ needs.set_build_params.outputs.DEPLOY_ENV }}"
          echo "My backend var: ${{ vars.WEB_APP_NAME }}"

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          allow-no-subscriptions: true

      - name: Build Image
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.build_only == 'true') || github.event_name != 'workflow_dispatch'
        run: |
            docker build -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/${{ vars.APP_NAME }}:${{ needs.set_build_params.outputs.BUILD_IMAGE_TAG }} .

      - name: Get Runner IP
        id: runner_ip
        uses: haythem/public-ip@v1.3

      - name: Allow ip
        run: az acr network-rule add --name ritam0190 --ip-address ${{ steps.runner_ip.outputs.ipv4 }}

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.AZURE_CLIENT_ID_SP }}
          password: ${{ secrets.AZURE_CLIENT_SECRET }}   

      - name: Push Image
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.build_only == 'true') || github.event_name != 'workflow_dispatch'
        run: |
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/${{ vars.APP_NAME }}:${{ needs.set_build_params.outputs.BUILD_IMAGE_TAG }}

      - name: Remove ip 
        run: az acr network-rule remove --name ritam0190 --ip-address ${{ steps.runner_ip.outputs.ipv4 }}
      
